name: Combined CI / Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  shared_ci_cd:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    uses: mu88/common/.github/workflows/ci-cd.yml@4e3d5313798009ef14a20532bb590147101941e8 # main
    with:
      sonar-key: 'mu88_mu88.Shared'
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  ci_cd:
    runs-on: ubuntu-latest

    needs: shared_ci_cd

    permissions:
      attestations: write
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          cache: true
          cache-dependency-path: '**/packages.lock.json'
          global-json-file: global.json

      - name: Pack .NET project and create NuGet package
        id: package
        shell: pwsh
        run: |
          $version = '${{ needs.shared_ci_cd.outputs.version }}'.Trim()
          dotnet pack src/mu88.Shared/mu88.Shared.csproj "/p:Version=$version"
          "path=src/mu88.Shared/bin/Release/mu88.Shared.$version.nupkg" >> $env:GITHUB_OUTPUT

      - name: Attest NuGet package build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.package.outputs.path }}

      - name: Extract package SPDX SBOM
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packagePath = "${{ steps.package.outputs.path }}"
          $sbomPath = "_manifest/spdx_2.2/manifest.spdx.json"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entry = $archive.GetEntry($sbomPath) ?? (throw "The NuGet package does not contain '$sbomPath'.")
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "sbom.spdx.json", $true)
          }
          finally {
            $archive.Dispose()
          }

      - name: Attest NuGet package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.path }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        run: |
          dotnet nuget push src/mu88.Shared/bin/Release/mu88.Shared.*.nupkg \
          --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
          --source https://api.nuget.org/v3/index.json
